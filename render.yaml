services:
  - type: web
    name: wavy
    env: node
    region: oregon
    plan: free
    buildCommand: ./build.sh
    startCommand: ./start.sh
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: NFC_ENCRYPTION_KEY
        sync: false
